<div class="container-admin">
  <!-- Cabecera de Administración -->
  <div class="admin-header">
    <div class="header-logo-section">
      <img src="Aldea-San-Antonio-White.png" alt="Logo Aldea San Antonio" class="admin-logo">
      <h1 class="admin-title">PANEL SUPER ADMINISTRADOR</h1>
    </div>
    <div class="brand-colors-bar">
      <div class="color-red"></div>
      <div class="color-yellow"></div>
      <div class="color-green"></div>
    </div>
  </div>

  <!-- Contenido de Solapas Orquestadas (FNT-02) -->
  <mat-tab-group class="custom-tabs-group" dynamicHeight>
    
    <!-- Pestaña 1: Gestión de Reservas y Bloqueos -->
    <mat-tab label="Gestión de Reservas y Bloqueos">
      <app-admin-reservas></app-admin-reservas>
    </mat-tab>

    <!-- Pestaña 2: Control de Usuarios -->
    <mat-tab label="Gestión de Usuarios">
      <app-admin-usuarios></app-admin-usuarios>
    </mat-tab>

    <!-- Pestaña 3: Control Domótica Shelly (IoT) -->
    <mat-tab label="Control Domótica (IoT)">
      <app-admin-domotica></app-admin-domotica>
    </mat-tab>

    <!-- Pestaña 4: Tarifas y Parámetros del Sistema -->
    <mat-tab label="Configuración y Tarifas">
      <app-admin-config></app-admin-config>
    </mat-tab>

  </mat-tab-group>
</div>
