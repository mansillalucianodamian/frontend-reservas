<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cielo de Verano -->
  <rect width="800" height="340" fill="url(#skyGrad)" />
  <circle cx="680" cy="90" r="50" fill="url(#sunGrad)" filter="url(#softGlow)" />
  
  <!-- Nubes suaves -->
  <path d="M120 110 a25 25 0 0 1 45 -10 a35 35 0 0 1 60 5 a25 25 0 0 1 10 45 h-115 a20 20 0 0 1 0 -40 z" fill="#ffffff" opacity="0.65" />
  <path d="M480 80 a20 20 0 0 1 35 -8 a30 30 0 0 1 50 4 a20 20 0 0 1 10 36 h-95 a16 16 0 0 1 0 -32 z" fill="#ffffff" opacity="0.55" />

  <!-- Borde Atérmico de la Pileta -->
  <polygon points="0,280 800,280 800,340 0,340" fill="url(#tileGrad)" />
  <line x1="0" y1="280" x2="800" y2="280" stroke="#cbd5e1" stroke-width="2" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#94a3b8" stroke-width="3" />

  <!-- Agua del Natatorio con Ondas Cristalinas -->
  <rect y="340" width="800" height="260" fill="url(#waterGrad)" />
  
  <!-- Carriles y líneas de natación subacuáticas -->
  <g stroke="#0369a1" stroke-width="3" stroke-dasharray="14 10" opacity="0.45">
    <line x1="160" y1="340" x2="110" y2="600" />
    <line x1="320" y1="340" x2="290" y2="600" />
    <line x1="480" y1="340" x2="510" y2="600" />
    <line x1="640" y1="340" x2="690" y2="600" />
  </g>

  <!-- Ondas y reflejos en la superficie del agua -->
  <g fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.75" stroke-linecap="round">
    <path d="M40 370 Q140 360 240 370 T440 370 T640 370 T760 370" />
    <path d="M80 415 Q200 405 320 415 T560 415 T740 415" />
    <path d="M20 460 Q160 445 300 460 T580 460 T780 460" stroke-width="3.5" />
    <path d="M90 515 Q240 500 390 515 T690 515" stroke-width="4" />
    <path d="M50 565 Q220 550 400 565 T750 565" stroke-width="4.5" />
  </g>

  <!-- Destellos solares sobre el agua -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="640" cy="380" r="4" />
    <circle cx="670" cy="405" r="3" />
    <circle cx="610" cy="425" r="5" />
    <circle cx="580" cy="390" r="3.5" />
    <circle cx="690" cy="450" r="4" />
    <circle cx="530" cy="410" r="3" />
  </g>

  <!-- Escalera de Natatorio Cromada en acero inoxidable -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 295 C180 260 205 260 205 310 L205 440" />
    <path d="M225 295 C225 260 250 260 250 310 L250 440" />
    <line x1="205" y1="340" x2="250" y2="340" stroke-width="6" />
    <line x1="205" y1="380" x2="250" y2="380" stroke-width="6" />
    <line x1="205" y1="420" x2="250" y2="420" stroke-width="6" />
  </g>

  <!-- Salvavidas Clásico de Seguridad Municipal -->
  <g transform="translate(680, 260)">
    <circle cx="0" cy="0" r="32" fill="#ef4444" stroke="#dc2626" stroke-width="2" />
    <circle cx="0" cy="0" r="15" fill="#e2e8f0" />
    <path d="M-6 -31 L-6 31 M6 -31 L6 31 M-31 -6 L31 -6 M-31 6 L31 6" stroke="#ffffff" stroke-width="4" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" />
  </g>
</svg>

